version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffmpeg_kit_flutter_new_audio: any
  file_picker: ^10.1.0
  path_provider: ^2.1.4
  share_plus: ^11.0.0
  http: ^1.2.2
  permission_handler: ^12.0.0
  flutter_foreground_task: ^7.5.2

flutter:
  uses-material-design: true
